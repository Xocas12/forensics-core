[project]
name = "forensics-core"
version = "0.1.0"
description = "Shared method library for statistical forensics of strategically reported data: digit tests, bunching at incentive notches, underdispersion, flow reconciliation, PU learning, rank-metric evaluation, provenance."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
forensics-manifest = "forensics_core.provenance.manifest:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forensics_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "PD", "RUF"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PD"]
