# SOURCES.yaml -- the source registry for the `gosplan` project.
#
# Nothing enters a pipeline without an entry here. Every entry was produced by an actual
# fetch attempt during scaffolding; no URL in this file was invented. Where a source could
# not be reached, the entry records that fact and why, rather than being omitted.
#
# Fields
#   access   free | registration | paywalled | archive_visit | manual_transcription
#            -- what a human has to do to get it, NOT whether it exists.
#   status   verified | partial | blocked | unverified
#            -- what the scaffolding session established about reachability:
#               verified   fetched, HTTP 200, and the content was confirmed to be what it claims
#               partial    landing page or some files reached; the full dataset was not confirmed
#               blocked    exists but cannot be fetched from here (gated, geo-blocked, 403, WAF)
#               unverified could not be confirmed at all
#   fetched_at / http_status  the research probe, not an acquisition into data/raw.
#   sha256 / bytes / local_path  filled by `make data` when a file actually lands in data/raw.
#   verification.verdict  an INDEPENDENT second agent re-fetched the URL and either
#                         confirmed, downgraded or refuted the first agent's claim.
#                         `not_verified` means that second check did not run.
#
# Regenerate the acquisition state with `make data`; edit provenance here by hand only with
# a note saying what was re-checked and when.

