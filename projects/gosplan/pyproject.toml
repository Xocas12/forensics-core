[project]
name = "forensic-gosplan"
version = "0.1.0"
description = "Soviet economic statistics: bound the volume of reporting distortion using methods calibrated on elections, aaer and china. Transcription + validation pipeline for scanned tables; CIA FOIA corpus fetcher."
requires-python = ">=3.12"
dependencies = [
    "forensics-core",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gosplan"]

[tool.uv.sources]
forensics-core = { workspace = true }
