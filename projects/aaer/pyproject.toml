[project]
name = "forensic-aaer"
version = "0.1.0"
description = "SEC Accounting and Auditing Enforcement Releases as labels for accounting misstatement: Beneish M-score baseline and PU-learning benchmark on SEC Financial Statement Data Sets."
requires-python = ">=3.12"
dependencies = [
    "forensics-core",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaer"]

[tool.uv.sources]
forensics-core = { workspace = true }
