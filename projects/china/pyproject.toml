[project]
name = "forensic-china"
version = "0.1.0"
description = "Provincial vs national GDP reconciliation for China, and provincial series against physical proxies (electricity, rail freight, credit, nightlights)."
requires-python = ">=3.12"
dependencies = [
    "forensics-core",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/china"]

[tool.uv.sources]
forensics-core = { workspace = true }
